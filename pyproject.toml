[project]
name = "jooble-scraper"
version = "0.1.0"
description = "Dash app that pulls recent job listings from the Jooble API and charts them."
readme = "README.md"
# Matches the Docker base image (python:3.12-slim); pandas 3 needs >= 3.11.
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dash>=4.5",                         # 4.5+ ships React 19 (required by DMC 3)
    "dash-bootstrap-components>=2.0.4",
    "dash-mantine-components>=3.0.0",
    "google-cloud-storage>=2.18",       # alert schedule store on Cloud Run
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.0.1",
    "requests>=2.34.2",
    # Production WSGI server used by the Dockerfile; Linux/macOS only.
    "gunicorn>=23.0.0; sys_platform != 'win32'",
]
